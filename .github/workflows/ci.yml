# CI sketch. Mirrors the local commands; uses only the throwaway compose
# MariaDB and never sees shared-server credentials.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Compose DB (backend/compose.test.yaml); fixed throwaway credentials.
      DATABASE_URL: mysql://root:test@127.0.0.1:33306/lodging_migrate
      SHADOW_DATABASE_URL: mysql://root:test@127.0.0.1:33306/lodging_shadow
      TEST_DATABASE_URL: root:test@tcp(127.0.0.1:33306)/lodging_test?parseTime=True
      APP_ENV: test
      # TestIntegrationAdminAuthEmulator needs the Auth Emulator; without it the test skips.
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_PROJECT_ID: demo-sakunoie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # The Auth Emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm ci
      - run: docker compose -f compose.test.yaml up -d --wait
      - name: Start the Firebase Auth Emulator
        working-directory: frontend
        run: |
          nohup firebase emulators:start --only auth --project "$FIREBASE_PROJECT_ID" > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf "http://$FIREBASE_AUTH_EMULATOR_HOST/" > /dev/null && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Prisma schema checks
        run: |
          npx prisma validate
          npx prisma format --check
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - name: Migrate and seed lodging_test
        run: bash scripts/db-reset-test.sh lodging_test
      - run: go vet ./...
      - run: go build ./...
      # Includes the OpenAPI drift test (backend/api/openapi_test.go).
      - run: go test -p 1 -count=1 -race ./...
      - if: always()
        run: docker compose -f compose.test.yaml down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx biome check
      - run: npx vitest run
      - run: npx next build

  # Playwright against compose MariaDB (lodging_e2e) + Firebase Auth Emulator + API :8180 +
  # Next standalone :3100, all started by frontend/scripts/e2e-stack.sh.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # The Auth Emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the E2E stack
        run: bash scripts/e2e-stack.sh start
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/.e2e-stack/*.log
          retention-days: 7
      - if: always()
        run: bash scripts/e2e-stack.sh stop
