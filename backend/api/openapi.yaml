components:
  schemas:
    AddCompanionsInputBody:
      additionalProperties: false
      properties:
        guests:
          description: Companions to append; registered + new must not exceed planned_guest_count
          items:
            $ref: "#/components/schemas/CompanionInput"
          maxItems: 20
          minItems: 1
          type: array
      required:
        - guests
      type: object
    AdminFacility:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          description: Facility ID; use it as facility_id in list and export filters. Not an authorization credential
          format: int64
          minimum: 0
          type: integer
        is_active:
          type: boolean
        max_guests:
          format: int64
          type: integer
        name:
          type: string
        timezone:
          description: IANA time zone
          type: string
      required:
        - id
        - code
        - name
        - timezone
        - max_guests
        - is_active
      type: object
    AdminFacilityRef:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        name:
          type: string
      required:
        - id
        - code
        - name
      type: object
    AdminGuest:
      additionalProperties: false
      properties:
        address:
          description: Masked unless reveal=true
          type: string
        email:
          description: Masked unless reveal=true
          type:
            - string
            - "null"
        full_name:
          type: string
        has_japan_address:
          type: boolean
        is_representative:
          type: boolean
        name_kana:
          type:
            - string
            - "null"
        nationality:
          type:
            - string
            - "null"
        passport_last4:
          description: Last 4 characters only
          type:
            - string
            - "null"
        phone:
          description: Masked unless reveal=true
          type:
            - string
            - "null"
        public_id:
          type: string
      required:
        - public_id
        - is_representative
        - full_name
        - name_kana
        - address
        - phone
        - email
        - has_japan_address
        - nationality
        - passport_last4
      type: object
    AdminLedgerMetrics:
      additionalProperties: false
      properties:
        guests:
          description: Registered guests
          format: int64
          type: integer
        incomplete:
          description: Registrations with fewer guests than planned
          format: int64
          type: integer
        registrations:
          format: int64
          type: integer
        verified:
          description: Registrations with identity verified by the host
          format: int64
          type: integer
      required:
        - registrations
        - guests
        - incomplete
        - verified
      type: object
    AdminPatchGuest:
      additionalProperties: false
      properties:
        address:
          maxLength: 2000
          minLength: 1
          type: string
        email:
          description: Empty string clears it
          maxLength: 255
          type: string
        full_name:
          maxLength: 255
          minLength: 1
          type: string
        has_japan_address:
          description: true discards any stored passport number
          type: boolean
        is_representative:
          description: "Only true is accepted: makes this guest the representative and unsets the previous one"
          type: boolean
        name_kana:
          description: Empty string clears it
          maxLength: 255
          type: string
        nationality:
          description: Required when has_japan_address is false
          maxLength: 100
          type: string
        passport_number:
          description: Write-only; re-encrypted. Required when has_japan_address is false and none is stored
          pattern: ^[A-Za-z0-9 ]{6,20}$
          type: string
        phone:
          description: Empty string clears it
          maxLength: 50
          type: string
        public_id:
          description: Guest public ID
          format: uuid
          type: string
      required:
        - public_id
      type: object
    AdminPatchRegistrationBody:
      additionalProperties: false
      properties:
        booking_reference:
          description: Empty string clears it
          maxLength: 255
          type: string
        booking_source:
          description: Empty string clears it
          maxLength: 50
          type: string
        capacity_override:
          description: Allow planned_guest_count above the current facility max_guests
          type: boolean
        check_in_date:
          format: date
          type: string
        check_out_date:
          format: date
          type: string
        estimated_arrival_time:
          description: HH:MM; empty string clears it
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          type: string
        guests:
          description: Guest corrections
          items:
            $ref: "#/components/schemas/AdminPatchGuest"
          maxItems: 20
          type:
            - array
            - "null"
        planned_guest_count:
          description: At least the registered count; above the current facility max_guests only with capacity_override
          format: int64
          maximum: 50
          minimum: 1
          type: integer
      type: object
    AdminRegistrationDetail:
      additionalProperties: false
      properties:
        active_edit_links:
          description: Unrevoked, unexpired edit links
          format: int64
          type: integer
        booking_reference:
          type:
            - string
            - "null"
        booking_source:
          type:
            - string
            - "null"
        capacity_snapshot:
          description: Facility max_guests at submission
          format: int64
          type: integer
        check_in_date:
          format: date
          type: string
        check_out_date:
          format: date
          type: string
        edit_link_expires_at:
          description: Latest expiry among active edit links
          format: date-time
          type:
            - string
            - "null"
        estimated_arrival_time:
          description: HH:MM
          type:
            - string
            - "null"
        facility:
          $ref: "#/components/schemas/AdminFacility"
        guests:
          items:
            $ref: "#/components/schemas/AdminGuest"
          type: array
        identity_verified:
          type: boolean
        identity_verified_at:
          format: date-time
          type:
            - string
            - "null"
        is_complete:
          type: boolean
        planned_guest_count:
          format: int64
          type: integer
        privacy_version:
          type: string
        public_id:
          type: string
        registered_count:
          format: int64
          type: integer
        remaining_count:
          format: int64
          type: integer
        revealed:
          description: Whether address/phone/email are unmasked
          type: boolean
        submitted_at:
          format: date-time
          type: string
        terms_version:
          type: string
        version:
          description: Same value as the ETag header; send it as If-Match on PATCH
          type: string
      required:
        - public_id
        - facility
        - check_in_date
        - check_out_date
        - estimated_arrival_time
        - planned_guest_count
        - capacity_snapshot
        - registered_count
        - remaining_count
        - is_complete
        - booking_source
        - booking_reference
        - terms_version
        - privacy_version
        - submitted_at
        - identity_verified
        - identity_verified_at
        - active_edit_links
        - edit_link_expires_at
        - revealed
        - version
        - guests
      type: object
    AdminRegistrationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AdminRegistrationRow"
          type: array
        metrics:
          $ref: "#/components/schemas/AdminLedgerMetrics"
        page:
          format: int64
          type: integer
        page_size:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - items
        - page
        - page_size
        - total
        - metrics
      type: object
    AdminRegistrationRow:
      additionalProperties: false
      properties:
        booking_reference:
          type:
            - string
            - "null"
        booking_source:
          type:
            - string
            - "null"
        check_in_date:
          format: date
          type: string
        check_out_date:
          format: date
          type: string
        facility:
          $ref: "#/components/schemas/AdminFacilityRef"
        identity_verified:
          type: boolean
        identity_verified_at:
          format: date-time
          type:
            - string
            - "null"
        is_complete:
          type: boolean
        planned_guest_count:
          format: int64
          type: integer
        public_id:
          type: string
        registered_count:
          format: int64
          type: integer
        remaining_count:
          format: int64
          type: integer
        representative_name:
          type: string
        submitted_at:
          format: date-time
          type: string
      required:
        - public_id
        - facility
        - check_in_date
        - check_out_date
        - booking_source
        - booking_reference
        - representative_name
        - planned_guest_count
        - registered_count
        - remaining_count
        - is_complete
        - identity_verified
        - identity_verified_at
        - submitted_at
      type: object
    CompanionInput:
      additionalProperties: false
      properties:
        address:
          maxLength: 2000
          minLength: 1
          type: string
        email:
          maxLength: 255
          type: string
        full_name:
          maxLength: 255
          minLength: 1
          type: string
        has_japan_address:
          type: boolean
        name_kana:
          maxLength: 255
          type: string
        nationality:
          description: Required when has_japan_address is false
          maxLength: 100
          type: string
        passport_number:
          description: Required when has_japan_address is false; write-only
          pattern: ^[A-Za-z0-9 ]{6,20}$
          type: string
        phone:
          maxLength: 50
          type: string
      required:
        - full_name
        - address
        - has_japan_address
      type: object
    CreateGuestRegistrationBody:
      additionalProperties: false
      properties:
        booking_reference:
          description: Booking reference (optional)
          maxLength: 255
          type: string
        booking_source:
          description: e.g. airbnb (optional)
          maxLength: 50
          type: string
        check_in_date:
          description: Local check-in date (YYYY-MM-DD)
          format: date
          type: string
        check_out_date:
          description: Local check-out date (YYYY-MM-DD), after check-in
          format: date
          type: string
        estimated_arrival_time:
          description: Local arrival time HH:MM (optional)
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          type: string
        facility_code:
          description: Facility code
          pattern: ^[a-z0-9-]{1,64}$
          type: string
        guests:
          description: 1..planned_guest_count guests, exactly one representative
          items:
            $ref: "#/components/schemas/GuestInput"
          maxItems: 20
          minItems: 1
          type: array
        planned_guest_count:
          description: Planned number of guests; at most the facility max_guests
          format: int64
          maximum: 50
          minimum: 1
          type: integer
        privacy_accepted:
          description: Must be true
          type: boolean
        privacy_version:
          description: Must equal the current privacy_version
          maxLength: 64
          minLength: 1
          type: string
        terms_accepted:
          description: Must be true
          type: boolean
        terms_version:
          description: Must equal the current terms_version
          maxLength: 64
          minLength: 1
          type: string
      required:
        - facility_code
        - check_in_date
        - check_out_date
        - planned_guest_count
        - terms_version
        - privacy_version
        - terms_accepted
        - privacy_accepted
        - guests
      type: object
    CreateGuestRegistrationResult:
      additionalProperties: false
      properties:
        check_in_date:
          format: date
          type: string
        check_out_date:
          format: date
          type: string
        code:
          description: Set on an idempotent replay that cannot issue another edit link (3 links already active, or the host reissued the link). The guest should contact the host
          enum:
            - edit_link_unavailable
          type: string
        edit_token:
          description: One-time secret for the manage URL fragment (#token=...). Null when code is edit_link_unavailable. Never stored by the server
          type:
            - string
            - "null"
        edit_token_expires_at:
          description: UTC instant; end of the checkout day in the facility time zone
          format: date-time
          type:
            - string
            - "null"
        facility_code:
          type: string
        is_complete:
          description: registered_count == planned_guest_count
          type: boolean
        planned_guest_count:
          format: int64
          type: integer
        public_id:
          description: Opaque registration ID
          type: string
        registered_count:
          description: Guests registered so far
          format: int64
          type: integer
        remaining_count:
          description: planned_guest_count - registered_count
          format: int64
          type: integer
      required:
        - public_id
        - facility_code
        - check_in_date
        - check_out_date
        - planned_guest_count
        - registered_count
        - remaining_count
        - is_complete
        - edit_token
        - edit_token_expires_at
      type: object
    ErrorDetailOut:
      additionalProperties: false
      properties:
        location:
          description: Where the problem is, e.g. body.guests[1].passport_number
          type: string
        message:
          description: What is wrong
          type: string
      required:
        - location
        - message
      type: object
    ErrorEnvelope:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code; clients localize by this
          examples:
            - validation_error
          type: string
        details:
          description: Field-level problems (may be empty)
          items:
            $ref: "#/components/schemas/ErrorDetailOut"
          type: array
        message:
          description: English summary for developers; not shown to guests verbatim
          type: string
        request_id:
          description: Matches the X-Request-Id response header
          type: string
      required:
        - code
        - message
        - details
        - request_id
      type: object
    FacilityPublic:
      additionalProperties: false
      properties:
        code:
          description: Stable facility code
          type: string
        max_guests:
          description: Current capacity policy (maximum planned guests)
          format: int64
          type: integer
        name:
          description: Facility name (localized labels live in frontend content)
          type: string
        privacy_version:
          description: Current privacy policy version the guest must accept
          type: string
        terms_version:
          description: Current terms version the guest must accept
          type: string
        timezone:
          description: IANA time zone of the facility
          type: string
      required:
        - code
        - name
        - max_guests
        - timezone
        - terms_version
        - privacy_version
      type: object
    GuestInput:
      additionalProperties: false
      properties:
        address:
          description: Address
          maxLength: 2000
          minLength: 1
          type: string
        email:
          description: Email (optional)
          maxLength: 255
          type: string
        full_name:
          description: Full name
          maxLength: 255
          minLength: 1
          type: string
        has_japan_address:
          description: Whether the guest has an address in Japan
          type: boolean
        is_representative:
          description: Exactly one guest must be the representative
          type: boolean
        name_kana:
          description: Name in katakana (optional)
          maxLength: 255
          type: string
        nationality:
          description: Required when has_japan_address is false
          maxLength: 100
          type: string
        passport_number:
          description: Required when has_japan_address is false. Write-only; stored encrypted, only the last 4 characters are ever returned
          pattern: ^[A-Za-z0-9 ]{6,20}$
          type: string
        phone:
          description: Phone (optional)
          maxLength: 50
          type: string
      required:
        - is_representative
        - full_name
        - address
        - has_japan_address
      type: object
    ListAdminFacilitiesOutputBody:
      additionalProperties: false
      properties:
        facilities:
          description: Facilities the admin is authorized for (owner role)
          items:
            $ref: "#/components/schemas/AdminFacility"
          type: array
      required:
        - facilities
      type: object
    ManageFacility:
      additionalProperties: false
      properties:
        code:
          type: string
        max_guests:
          format: int64
          type: integer
        name:
          type: string
        timezone:
          type: string
      required:
        - code
        - name
        - timezone
        - max_guests
      type: object
    ManageGuest:
      additionalProperties: false
      properties:
        editable:
          description: Whether the edit token may correct this guest (companions only)
          type: boolean
        email_masked:
          type:
            - string
            - "null"
        full_name_masked:
          description: e.g. T*** G***
          type: string
        has_japan_address:
          type: boolean
        is_representative:
          type: boolean
        name_kana_masked:
          type:
            - string
            - "null"
        passport_last4:
          description: Last 4 characters only
          type:
            - string
            - "null"
        phone_masked:
          type:
            - string
            - "null"
        public_id:
          type: string
      required:
        - public_id
        - is_representative
        - full_name_masked
        - name_kana_masked
        - phone_masked
        - email_masked
        - has_japan_address
        - passport_last4
        - editable
      type: object
    ManageSummary:
      additionalProperties: false
      properties:
        booking_reference:
          type:
            - string
            - "null"
        booking_source:
          type:
            - string
            - "null"
        check_in_date:
          format: date
          type: string
        check_out_date:
          format: date
          type: string
        edit_expires_at:
          description: UTC instant after which the edit token returns 410
          format: date-time
          type: string
        estimated_arrival_time:
          description: HH:MM
          type:
            - string
            - "null"
        facility:
          $ref: "#/components/schemas/ManageFacility"
        guests:
          items:
            $ref: "#/components/schemas/ManageGuest"
          type: array
        is_complete:
          type: boolean
        planned_guest_count:
          format: int64
          type: integer
        public_id:
          type: string
        registered_count:
          format: int64
          type: integer
        remaining_count:
          format: int64
          type: integer
        version:
          description: Same value as the ETag header; send it as If-Match on PATCH
          type: string
      required:
        - public_id
        - facility
        - check_in_date
        - check_out_date
        - estimated_arrival_time
        - planned_guest_count
        - registered_count
        - remaining_count
        - is_complete
        - booking_source
        - booking_reference
        - edit_expires_at
        - version
        - guests
      type: object
    PatchManageGuestBody:
      additionalProperties: false
      properties:
        address:
          maxLength: 2000
          minLength: 1
          type: string
        email:
          description: Empty string clears it
          maxLength: 255
          type: string
        full_name:
          maxLength: 255
          minLength: 1
          type: string
        has_japan_address:
          description: Not editable with an edit token (403 field_not_editable)
          type: boolean
        is_representative:
          description: Not editable with an edit token (403 field_not_editable)
          type: boolean
        name_kana:
          description: Empty string clears it
          maxLength: 255
          type: string
        nationality:
          description: Not editable with an edit token (403 field_not_editable)
          type: string
        passport_number:
          description: Not editable with an edit token (403 field_not_editable)
          type: string
        phone:
          description: Empty string clears it
          maxLength: 50
          type: string
      type: object
    PatchManageRegistrationBody:
      additionalProperties: false
      properties:
        booking_reference:
          description: Empty string clears it
          maxLength: 255
          type: string
        booking_source:
          description: Empty string clears it
          maxLength: 50
          type: string
        check_in_date:
          description: Not editable with an edit token (403 field_not_editable); ask the host
          type: string
        check_out_date:
          description: Not editable with an edit token (403 field_not_editable); ask the host
          type: string
        estimated_arrival_time:
          description: HH:MM; empty string clears it
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          type: string
        facility_code:
          description: Not editable with an edit token (403 field_not_editable)
          type: string
        planned_guest_count:
          description: At least the registered count and at most the current facility max_guests
          format: int64
          maximum: 50
          minimum: 1
          type: integer
      type: object
    ReissueEditLinkResult:
      additionalProperties: false
      properties:
        edit_token:
          description: New one-time secret for the manage URL fragment (#token=...). Shown once; never stored by the server. All earlier links are revoked
          type: string
        edit_token_expires_at:
          description: UTC instant; end of the current checkout day in the facility time zone
          format: date-time
          type: string
        expired:
          description: True when the checkout day has already ended, so the new link is not usable
          type: boolean
      required:
        - edit_token
        - edit_token_expires_at
        - expired
      type: object
    SubmitSurveyBody:
      additionalProperties: false
      properties:
        answers:
          additionalProperties: {}
          description: "Answers keyed by question code (q01..q10). rating_1_5: integer 1-5; single_choice: option code; multi_choice: array of distinct option codes; text: string up to maxLength characters. Omit unanswered questions."
          maxProperties: 20
          type: object
        facility_code:
          description: Facility code (resolved server-side to an active facility; unknown or inactive → 422 facility_unavailable)
          pattern: ^[a-z0-9-]{1,64}$
          type: string
        survey_version:
          description: Version of the question set the answers belong to (currently v1)
          maxLength: 64
          minLength: 1
          type: string
        website:
          description: Honeypot; leave empty. A non-empty value is accepted with 202 and discarded
          maxLength: 200
          type: string
      required:
        - facility_code
        - survey_version
        - answers
      type: object
    SurveyCount:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        value:
          description: Option code, or the rating 1-5 as a string
          type: string
      required:
        - value
        - count
      type: object
    SurveyQuestionSummary:
      additionalProperties: false
      properties:
        answered:
          description: "Responses that answered this question (for text: non-empty answers; the text itself is never returned)"
          format: int64
          type: integer
        code:
          type: string
        counts:
          description: "rating_1_5: counts for 1..5; single/multi_choice: counts per option in definition order; null for text"
          items:
            $ref: "#/components/schemas/SurveyCount"
          type:
            - array
            - "null"
        mean:
          description: "rating_1_5 only: mean rounded to 2 decimals"
          format: double
          type:
            - number
            - "null"
        suppressed:
          description: True when answered < min_responses; mean and counts are then null
          type: boolean
        type:
          enum:
            - rating_1_5
            - single_choice
            - multi_choice
            - text
          type: string
      required:
        - code
        - type
        - answered
        - suppressed
        - mean
        - counts
      type: object
    SurveySummary:
      additionalProperties: false
      properties:
        from:
          format: date
          type:
            - string
            - "null"
        min_responses:
          description: Small-cell threshold (SURVEY_MIN_RESPONSES)
          format: int64
          type: integer
        questions:
          items:
            $ref: "#/components/schemas/SurveyQuestionSummary"
          type: array
        survey_version:
          description: Only responses of this (current) version are aggregated
          type: string
        to:
          format: date
          type:
            - string
            - "null"
        total:
          description: Responses matching the filter
          format: int64
          type: integer
      required:
        - survey_version
        - from
        - to
        - total
        - min_responses
        - questions
      type: object
  securitySchemes:
    adminBearer:
      bearerFormat: JWT
      description: Firebase ID token (admin endpoints)
      scheme: bearer
      type: http
    editToken:
      description: Guest edit token from the manage URL fragment
      scheme: bearer
      type: http
info:
  description: Guest registration API for Saku no Ie. Errors use the envelope {code, message, details, request_id}.
  title: Saku no Ie API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/admin/facilities:
    get:
      description: Facilities with an owner row in admin_facility_access for the signed-in admin.
      operationId: list-admin-facilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminFacilitiesOutputBody"
          description: OK
        "401":
