components:
  schemas:
    AddCompanionsInputBody:
      additionalProperties: false
      properties:
        guests:
          description: Companions to append; registered + new must not exceed planned_guest_count
          items:
            $ref: "#/components/schemas/CompanionInput"
          maxItems: 20
          minItems: 1
          type: array
      required:
        - guests
      type: object
    CompanionInput:
      additionalProperties: false
      properties:
        address:
          maxLength: 2000
          minLength: 1
          type: string
        email:
          maxLength: 255
          type: string
        full_name:
          maxLength: 255
          minLength: 1
          type: string
        has_japan_address:
          type: boolean
        name_kana:
          maxLength: 255
          type: string
        nationality:
          description: Required when has_japan_address is false
          maxLength: 100
          type: string
        passport_number:
          description: Required when has_japan_address is false; write-only
          pattern: ^[A-Za-z0-9 ]{6,20}$
          type: string
        phone:
          maxLength: 50
          type: string
      required:
        - full_name
        - address
        - has_japan_address
      type: object
    CreateGuestRegistrationBody:
      additionalProperties: false
      properties:
        booking_reference:
          description: Booking reference (optional)
          maxLength: 255
          type: string
        booking_source:
          description: e.g. airbnb (optional)
          maxLength: 50
          type: string
        check_in_date:
          description: Local check-in date (YYYY-MM-DD)
          format: date
          type: string
        check_out_date:
          description: Local check-out date (YYYY-MM-DD), after check-in
          format: date
          type: string
        estimated_arrival_time:
          description: Local arrival time HH:MM (optional)
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          type: string
        facility_code:
          description: Facility code
          pattern: ^[a-z0-9-]{1,64}$
          type: string
        guests:
          description: 1..planned_guest_count guests, exactly one representative
          items:
            $ref: "#/components/schemas/GuestInput"
          maxItems: 20
          minItems: 1
          type: array
        planned_guest_count:
          description: Planned number of guests; at most the facility max_guests
          format: int64
          maximum: 50
          minimum: 1
          type: integer
        privacy_accepted:
          description: Must be true
          type: boolean
        privacy_version:
          description: Must equal the current privacy_version
          maxLength: 64
          minLength: 1
          type: string
        terms_accepted:
          description: Must be true
          type: boolean
        terms_version:
          description: Must equal the current terms_version
          maxLength: 64
          minLength: 1
          type: string
      required:
        - facility_code
        - check_in_date
        - check_out_date
        - planned_guest_count
        - terms_version
        - privacy_version
        - terms_accepted
        - privacy_accepted
        - guests
      type: object
    CreateGuestRegistrationResult:
      additionalProperties: false
      properties:
        check_in_date:
          format: date
          type: string
        check_out_date:
          format: date
          type: string
        code:
          description: Set on an idempotent replay that cannot issue another edit link (3 links already active, or the host reissued the link). The guest should contact the host
          enum:
            - edit_link_unavailable
          type: string
        edit_token:
          description: One-time secret for the manage URL fragment (#token=...). Null when code is edit_link_unavailable. Never stored by the server
          type:
            - string
            - "null"
        edit_token_expires_at:
          description: UTC instant; end of the checkout day in the facility time zone
          format: date-time
          type:
            - string
            - "null"
        facility_code:
          type: string
        is_complete:
          description: registered_count == planned_guest_count
          type: boolean
        planned_guest_count:
          format: int64
          type: integer
        public_id:
          description: Opaque registration ID
          type: string
        registered_count:
          description: Guests registered so far
          format: int64
          type: integer
        remaining_count:
          description: planned_guest_count - registered_count
          format: int64
          type: integer
      required:
        - public_id
        - facility_code
        - check_in_date
        - check_out_date
        - planned_guest_count
        - registered_count
        - remaining_count
        - is_complete
        - edit_token
        - edit_token_expires_at
      type: object
    ErrorDetailOut:
      additionalProperties: false
      properties:
        location:
          description: Where the problem is, e.g. body.guests[1].passport_number
          type: string
        message:
          description: What is wrong
          type: string
      required:
        - location
        - message
      type: object
    ErrorEnvelope:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable error code; clients localize by this
          examples:
            - validation_error
          type: string
        details:
          description: Field-level problems (may be empty)
          items:
            $ref: "#/components/schemas/ErrorDetailOut"
          type: array
        message:
          description: English summary for developers; not shown to guests verbatim
          type: string
        request_id:
          description: Matches the X-Request-Id response header
          type: string
      required:
        - code
        - message
        - details
        - request_id
      type: object
    FacilityPublic:
      additionalProperties: false
      properties:
        code:
          description: Stable facility code
          type: string
        max_guests:
          description: Current capacity policy (maximum planned guests)
          format: int64
          type: integer
        name:
          description: Facility name (localized labels live in frontend content)
          type: string
        privacy_version:
          description: Current privacy policy version the guest must accept
          type: string
        terms_version:
          description: Current terms version the guest must accept
          type: string
        timezone:
          description: IANA time zone of the facility
          type: string
      required:
        - code
        - name
        - max_guests
        - timezone
        - terms_version
        - privacy_version
      type: object
    GuestInput:
      additionalProperties: false
      properties:
        address:
          description: Address
          maxLength: 2000
          minLength: 1
          type: string
        email:
          description: Email (optional)
          maxLength: 255
          type: string
        full_name:
          description: Full name
          maxLength: 255
          minLength: 1
          type: string
        has_japan_address:
          description: Whether the guest has an address in Japan
          type: boolean
        is_representative:
          description: Exactly one guest must be the representative
          type: boolean
        name_kana:
          description: Name in katakana (optional)
          maxLength: 255
          type: string
        nationality:
          description: Required when has_japan_address is false
          maxLength: 100
          type: string
        passport_number:
          description: Required when has_japan_address is false. Write-only; stored encrypted, only the last 4 characters are ever returned
          pattern: ^[A-Za-z0-9 ]{6,20}$
          type: string
        phone:
          description: Phone (optional)
          maxLength: 50
          type: string
      required:
        - is_representative
        - full_name
        - address
        - has_japan_address
      type: object
    ManageFacility:
      additionalProperties: false
      properties:
        code:
          type: string
        max_guests:
          format: int64
          type: integer
        name:
          type: string
        timezone:
          type: string
      required:
        - code
        - name
        - timezone
        - max_guests
      type: object
    ManageGuest:
      additionalProperties: false
      properties:
        editable:
          description: Whether the edit token may correct this guest (companions only)
          type: boolean
        email_masked:
          type:
            - string
            - "null"
        full_name_masked:
          description: e.g. T*** G***
          type: string
        has_japan_address:
          type: boolean
        is_representative:
          type: boolean
        name_kana_masked:
          type:
            - string
            - "null"
        passport_last4:
          description: Last 4 characters only
          type:
            - string
            - "null"
        phone_masked:
          type:
            - string
            - "null"
        public_id:
          type: string
      required:
        - public_id
        - is_representative
        - full_name_masked
        - name_kana_masked
        - phone_masked
        - email_masked
        - has_japan_address
        - passport_last4
        - editable
      type: object
    ManageSummary:
      additionalProperties: false
      properties:
        booking_reference:
          type:
            - string
            - "null"
        booking_source:
          type:
            - string
            - "null"
        check_in_date:
          format: date
          type: string
        check_out_date:
          format: date
          type: string
        edit_expires_at:
          description: UTC instant after which the edit token returns 410
          format: date-time
          type: string
        estimated_arrival_time:
          description: HH:MM
          type:
            - string
            - "null"
        facility:
          $ref: "#/components/schemas/ManageFacility"
        guests:
          items:
            $ref: "#/components/schemas/ManageGuest"
          type: array
        is_complete:
          type: boolean
        planned_guest_count:
          format: int64
          type: integer
        public_id:
          type: string
        registered_count:
          format: int64
          type: integer
        remaining_count:
          format: int64
          type: integer
        version:
          description: Same value as the ETag header; send it as If-Match on PATCH
          type: string
      required:
        - public_id
        - facility
        - check_in_date
        - check_out_date
        - estimated_arrival_time
        - planned_guest_count
        - registered_count
        - remaining_count
        - is_complete
        - booking_source
        - booking_reference
        - edit_expires_at
        - version
        - guests
      type: object
    PatchManageGuestBody:
      additionalProperties: false
      properties:
        address:
          maxLength: 2000
          minLength: 1
          type: string
        email:
          description: Empty string clears it
          maxLength: 255
          type: string
        full_name:
          maxLength: 255
          minLength: 1
          type: string
        has_japan_address:
          description: Not editable with an edit token (403 field_not_editable)
          type: boolean
        is_representative:
          description: Not editable with an edit token (403 field_not_editable)
          type: boolean
        name_kana:
          description: Empty string clears it
          maxLength: 255
          type: string
        nationality:
          description: Not editable with an edit token (403 field_not_editable)
          type: string
        passport_number:
          description: Not editable with an edit token (403 field_not_editable)
          type: string
        phone:
          description: Empty string clears it
          maxLength: 50
          type: string
      type: object
    PatchManageRegistrationBody:
      additionalProperties: false
      properties:
        booking_reference:
          description: Empty string clears it
          maxLength: 255
          type: string
        booking_source:
          description: Empty string clears it
          maxLength: 50
          type: string
        check_in_date:
          description: Not editable with an edit token (403 field_not_editable); ask the host
          type: string
        check_out_date:
          description: Not editable with an edit token (403 field_not_editable); ask the host
          type: string
        estimated_arrival_time:
          description: HH:MM; empty string clears it
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9])?$
          type: string
        facility_code:
          description: Not editable with an edit token (403 field_not_editable)
          type: string
        planned_guest_count:
          description: At least the registered count and at most the current facility max_guests
          format: int64
          maximum: 50
          minimum: 1
          type: integer
      type: object
  securitySchemes:
    adminBearer:
      bearerFormat: JWT
      description: Firebase ID token (admin endpoints)
      scheme: bearer
      type: http
    editToken:
      description: Guest edit token from the manage URL fragment
      scheme: bearer
      type: http
info:
  description: Guest registration API for Saku no Ie. Errors use the envelope {code, message, details, request_id}.
  title: Saku no Ie API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/facilities/{code}/public:
    get:
      description: Public name, capacity, time zone and current terms/privacy versions of an active facility. Never returns internal IDs.
      operationId: get-facility-public
      parameters:
        - description: Facility code, e.g. saku-no-ie
          in: path
          name: code
          required: true
          schema:
            description: Facility code, e.g. saku-no-ie
            pattern: ^[a-z0-9-]{1,64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityPublic"
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Get public facility information
      tags:
        - Facilities
  /api/v1/guest-registrations:
    post:
      description: Creates one registration with 1..N guests in one transaction. Requires Idempotency-Key. 201 on create; 200 on an idempotent replay of the same body, which returns a new additional edit token, or edit_token=null with code=edit_link_unavailable when 3 links are active or the host reissued the link. Same key with a different body → 409 idempotency_conflict.
      operationId: create-guest-registration
      parameters:
        - description: Client-generated key (e.g. a UUID), reused on retries of the same submission
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: Client-generated key (e.g. a UUID), reused on retries of the same submission
            maxLength: 128
            minLength: 16
            pattern: ^[A-Za-z0-9_.:-]+$
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuestRegistrationBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGuestRegistrationResult"
          description: Idempotent replay (same Idempotency-Key and body)
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGuestRegistrationResult"
          description: Created
          headers:
            Cache-Control:
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      summary: Submit a guest registration
      tags:
        - Guest registrations
  /api/v1/guest-registrations/manage:
    get:
      description: "Minimal masked summary. Passport numbers are never returned (last 4 only). Cache-Control: no-store."
      operationId: get-manage-registration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageSummary"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Gone
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      security:
        - editToken: []
      summary: Get the registration for an edit token
      tags:
        - Guest manage
    patch:
      description: "Allowlist: estimated_arrival_time, booking_source, booking_reference, planned_guest_count (>= registered, <= facility max_guests). Requires If-Match."
      operationId: patch-manage-registration
      parameters:
        - description: ETag from the last GET (required; 412 when stale)
          in: header
          name: If-Match
          required: true
          schema:
            description: ETag from the last GET (required; 412 when stale)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchManageRegistrationBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageSummary"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Conflict
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Gone
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Precondition Failed
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      security:
        - editToken: []
      summary: Correct low-risk registration fields
      tags:
        - Guest manage
  /api/v1/guest-registrations/manage/guests:
    post:
      description: Appends companions transactionally; registered + new must not exceed planned_guest_count (409 capacity_exceeded).
      operationId: add-manage-companions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCompanionsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageSummary"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Conflict
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Gone
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      security:
        - editToken: []
      summary: Add companions
      tags:
        - Guest manage
  /api/v1/guest-registrations/manage/guests/{guest_public_id}:
    patch:
      description: "Companions only: full_name, name_kana, address, phone, email. The representative and identity fields → 403 field_not_editable. Requires If-Match."
      operationId: patch-manage-guest
      parameters:
        - description: Guest public ID from the manage summary
          in: path
          name: guest_public_id
          required: true
          schema:
            description: Guest public ID from the manage summary
            format: uuid
            type: string
        - description: ETag from the last GET (required; 412 when stale)
          in: header
          name: If-Match
          required: true
          schema:
            description: ETag from the last GET (required; 412 when stale)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchManageGuestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManageSummary"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Not Found
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Gone
        "412":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Precondition Failed
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      security:
        - editToken: []
      summary: Correct a companion
      tags:
        - Guest manage
