// TABINOTE prototype v1: persist this browser's demo data between visits.
// Production multi-device sharing will require a real backend and authentication.
const TABINOTE_STORE='tabinote_prototype_v1';
function persistState(){
 try{
  const state={posts,isMember,inviteValidated,memberName,memberAvatar,introSeen,gpsVisits,reviews};
  localStorage.setItem(TABINOTE_STORE,JSON.stringify(state));
 }catch(err){ console.warn('TABINOTE: 保存できませんでした',err); }
}
function restoreState(){
 try{
  const raw=localStorage.getItem(TABINOTE_STORE); if(!raw)return;
  const state=JSON.parse(raw);
  if(Array.isArray(state.posts)) posts=state.posts;
  if(typeof state.isMember==='boolean') isMember=state.isMember;
  if(typeof state.inviteValidated==='boolean') inviteValidated=state.inviteValidated;
  if(typeof state.memberName==='string') memberName=state.memberName;
  if(typeof state.memberAvatar==='string') memberAvatar=state.memberAvatar;
  if(typeof state.introSeen==='boolean') introSeen=state.introSeen;
  if(Array.isArray(state.gpsVisits)) gpsVisits=state.gpsVisits;
  if(Array.isArray(state.reviews)) reviews=state.reviews;
 }catch(err){ console.warn('TABINOTE: 保存データを読み込めませんでした',err); }
}
function resetDemoData(){
 if(!confirm('このブラウザに保存したTABINOTEの試用データを削除しますか？'))return;
 localStorage.removeItem(TABINOTE_STORE); location.reload();
}

let autoWeatherData={weather:'取得中',temp:18,icon:'🌤️',source:'取得中'};
function weatherLabel(code){
 if(code===0)return ['晴れ','☀️'];
 if([1,2].includes(code))return ['晴れ時々くもり','🌤️'];
 if(code===3)return ['くもり','☁️'];
 if([45,48].includes(code))return ['霧','🌫️'];
 if([51,53,55,56,57].includes(code))return ['小雨','🌦️'];
 if([61,63,65,66,67,80,81,82].includes(code))return ['雨','🌧️'];
 if([71,73,75,77,85,86].includes(code))return ['雪','❄️'];
 if([95,96,99].includes(code))return ['雷雨','⛈️'];
 return ['くもり','☁️'];
}
function setAutoWeather(weather,temp,icon,source){
 autoWeatherData={weather,temp,icon,source};
 const card=document.getElementById('autoWeatherCard');
 if(!card)return;
 const t=document.getElementById('autoWeatherText'),i=document.getElementById('autoWeatherIcon'),s=document.getElementById('autoWeatherSource');
 if(t)t.textContent=`${weather}・${temp}℃`;
 if(i)i.textContent=icon;
 if(s)s.textContent=source;
 const form=document.getElementById('postForm');
 if(form){const w=form.querySelector('[name="weather"]'),c=form.querySelector('[name="temp"]');if(w)w.value=weather;if(c)c.value=String(temp)}
}
async function refreshAutoWeather(showMessage=false){
 const card=document.getElementById('autoWeatherCard');
 if(!card)return;
 const text=document.getElementById('autoWeatherText');
 if(text)text.textContent='天気・気温を取得しています…';
 // This prototype uses Saku City as the default area; no precise GPS location is requested.
 const lat=36.2488,lon=138.4769;
 try{
   const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=Asia%2FTokyo`;
   const response=await fetch(url);
   if(!response.ok)throw new Error('weather request failed');
   const data=await response.json();
   const current=data.current;
   if(!current)throw new Error('missing current weather');
   const [weather,icon]=weatherLabel(Number(current.weather_code));
   setAutoWeather(weather,Math.round(Number(current.temperature_2m)),icon,'佐久市周辺の現在の天気（自動取得）');
   if(showMessage)toast('天気・気温を更新しました');
 }catch(err){
   setAutoWeather('未取得',18,'🌤️','天気を取得できませんでした。ネット接続後に「更新」を押してね');
   if(showMessage)toast('天気を取得できませんでした');
 }
}

async function runAiTranslation(){
 const text=document.getElementById('aiTranslateInput')?.value||'';
 const lang=document.getElementById('aiTranslateLang')?.value||'ja';
 const out=document.getElementById('aiTranslateOutput');if(!text.trim()){toast('翻訳したい文章を入力してね');return}
 out.style.display='block';out.textContent='翻訳中…';
 try{
   const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair='+encodeURIComponent((/[\u3040-\u30ff\u4e00-\u9fff]/.test(text)?'ja':/[가-힣]/.test(text)?'ko':'en')+'|'+lang);
   const res=await fetch(url);if(!res.ok)throw new Error('translation failed');
   const data=await res.json();const translated=data?.responseData?.translatedText;
   if(!translated)throw new Error('empty translation');
   out.textContent=translated;
 }catch(e){out.textContent='翻訳を取得できませんでした。インターネット接続を確認して、もう一度試してね。';}
}

function rankingView(){
 if(rankingMode==='posts'){
  const top=posts.slice().sort((a,b)=>b.likes-a.likes).slice(0,3);
  return top.length?`<div class="rank-list">${top.map((p,i)=>`<button class="rank-item" onclick="openPlaceByName('${esc(p.place)}')"><span class="rank-no">${i+1}</span><span class="rank-main"><strong>${esc(p.title)}</strong><small>${esc(p.place)} · ${esc(p.user)}</small></span><span class="rank-score">♡ ${p.likes}</span></button>`).join('')}</div>`:'<div class="empty">まだ投稿がありません。</div>';
 }
 const top=places.filter(p=>p.kind!=='宿泊').map(p=>{const related=posts.filter(x=>x.place===p.name);const likes=related.reduce((n,x)=>n+x.likes,0);const saves=related.filter(x=>x.saved).length;return {...p,score:p.visits+likes+saves*3,relatedCount:related.length,likes}}).sort((a,b)=>b.score-a.score).slice(0,3);
 return `<div class="rank-list">${top.map((p,i)=>`<button class="rank-item" onclick="openSpot('${p.id}')"><span class="rank-no">${i+1}</span><span class="spotemoji" style="width:42px;height:42px;font-size:22px;flex:0 0 42px">${p.emoji}</span><span class="rank-main"><strong>${esc(p.name)}</strong><small>${esc(p.area)} · ${esc(p.kind)} · 関連投稿 ${p.relatedCount}件</small></span><span class="rank-score">人気</span></button>`).join('')}</div>`;
}

 let list=posts.filter(p=>(filter==='すべて'||p.area===filter)&&(weatherFilter==='すべて'||p.weather===weatherFilter)&&(monthFilter==='すべて'||String(p.date||'').startsWith(monthFilter))&&(!q||[p.title,p.place,p.body,p.area,p.tags.join(' '),p.weather,p.date].join(' ').toLowerCase().includes(q)));
 let content=list.length?(feedMode==='grid'?`<div class="feed-grid">${list.map(p=>`<button class="grid-post" onclick="openPlaceByName('${esc(p.place)}')">${postMedia(p)}<div class="grid-stats">${p.mediaType==='video'?'▶ ':' '}${esc(p.place)}　♡ ${p.likes}</div></button>`).join('')}</div>`:list.map(postCard).join('')):'<div class="empty">投稿が見つかりませんでした。<br>天気・月・地域や検索ワードを変えてみてね。</div>';
 return `<div class="hero"><div class="eyebrow">DISCOVER NAGANO</div><h1>次の旅のヒントを、<br>みんなの記録から。</h1><p>佐久の家に泊まった人たちの、おすすめが集まる旅のSNS。</p><button class="btn" onclick="go('map')">⌖ スポットを探す</button></div><section style="margin:0 0 18px"><div class="feed-modebar"><div><h2 style="margin:0 0 3px">🏆 人気ランキング</h2><span class="muted">宿泊者のおすすめをチェック</span></div></div><div class="rank-tabs"><button class="${rankingMode==='spots'?'active':''}" onclick="rankingMode='spots';render()">人気スポット</button><button class="${rankingMode==='posts'?'active':''}" onclick="rankingMode='posts';render()">人気の投稿</button></div>${rankingView()}<p class="muted" style="margin:0">※順位は試作品用のサンプルデータです。</p></section><div class="chips">${['すべて','東信','北信','中信','南信'].map(x=>`<button class="chip ${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class="filter-panel"><div class="filter-heading">🔎 条件で絞り込む</div><div class="grid2"><label class="field">天気<select class="filter-select" onchange="weatherFilter=this.value;render()">${['すべて','晴れ','くもり','小雨','雨','雪'].map(x=>`<option value="${x}" ${weatherFilter===x?'selected':''}>${x==='すべて'?'すべての天気':x}</option>`).join('')}</select></label><label class="field">訪問した月<select class="filter-select" onchange="monthFilter=this.value;render()"><option value="すべて" ${monthFilter==='すべて'?'selected':''}>すべての月</option>${months.map(m=>`<option value="${m}" ${monthFilter===m?'selected':''}>${m.replace('-','年')}月</option>`).join('')}</select></label></div><div class="muted">天気と月は組み合わせて検索できるよ。</div><button class="action" style="margin-top:9px" onclick="filter='すべて';weatherFilter='すべて';monthFilter='すべて';$('#globalSearch').value='';render()">条件をリセット</button></div><div class="feed-modebar"><div><h2 style="margin:0 0 3px">みんなの旅ノート</h2><span class="muted">${list.length}件 · 天気・月で絞り込み</span></div><div class="feed-switch"><button class="view-btn ${feedMode==='grid'?'active':''}" aria-label="グリッド表示" onclick="feedMode='grid';render()">▦</button><button class="view-btn ${feedMode==='list'?'active':''}" aria-label="一覧表示" onclick="feedMode='list';render()">☰</button></div></div>${content}`
}
function mapView(){let shown=places.filter(p=>(filter==='すべて'||p.area===filter)&&(!$('#globalSearch').value||[p.name,p.area,p.kind,p.desc].join(' ').toLowerCase().includes($('#globalSearch').value.toLowerCase())));return `<div class="eyebrow">EXPLORE BY MAP</div><h1>長野を、地図から探す。</h1><p class="muted">地域を選んで、気になるスポットをタップしてね。</p><div class="card"><div class="postbody"><span class="pill">📍 旅の足あと</span><h2 style="margin-top:10px">訪れた場所を記録しよう</h2><p class="muted" style="line-height:1.7">常時追跡はしません。ボタンを押したときだけ現在地を取得し、訪問スポットとして記録できます。</p><button class="btn full" onclick="getCurrentLocation()">📍 現在地を取得して記録する</button><button class="btn secondary full" onclick="gpsFormOpen=!gpsFormOpen;render()">スポットを手動で記録</button>${gpsStatus?`<p class="muted" style="margin-top:10px">${esc(gpsStatus)}</p>`:''}${gpsPosition?`<p class="weather" style="margin-top:8px">位置情報を取得済み · 精度 約${Math.round(gpsPosition.accuracy||0)}m</p>`:''}${gpsFormOpen?gpsRecordForm():''}</div></div><div class="chips">${['すべて','東信','北信','中信','南信'].map(x=>`<button class="chip ${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class="mapbox"><div class="river"></div>${places.map((p,i)=>`<button class="pin p${i+1} ${selectedPlace===p.id?'selected':''}" onclick="selectSpot('${p.id}')">${p.emoji} ${p.name}</button>`).join('')}</div>${selectedPlace?spotDetailInline(places.find(p=>p.id===selectedPlace)):''}<h2>スポット一覧 <span class="muted">(${shown.length})</span></h2>${shown.map(p=>`<button class="spotrow" style="width:100%;text-align:left;border-left:0;border-right:0;border-top:0" onclick="selectSpot('${p.id}')"><div class="spotemoji">${p.emoji}</div><div class="grow"><strong>${p.name}</strong><div class="muted">${p.area} · ${p.kind}</div><div class="muted">${p.desc}</div></div><span>›</span></button>`).join('')}`}
function gpsRecordForm(){return `<form id="gpsVisitForm"><h3 style="margin-top:12px">スポット記録</h3><label class="field">スポット名<select name="place">${places.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}<option value="custom">その他（自由入力）</option></select></label><label class="field">その他の場所（任意）<input name="customPlace" placeholder="スポット名"></label><div class="grid2"><label class="field">訪問日<input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field">天気<select name="weather"><option>未設定</option><option>晴れ</option><option>くもり</option><option>小雨</option><option>雨</option><option>雪</option></select></label></div><label class="field">気温（℃・任意）<input name="temp" type="number" min="-30" max="50" placeholder="例：18"></label><label class="field">写真・感想<textarea name="note" placeholder="ここで見た景色、旅の思い出"></textarea></label><label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.6;margin:12px 0"><input type="checkbox" name="public" checked style="margin-top:3px"> <span><strong>全体に公開する</strong><br>初期設定は公開です。公開後も非公開に変更できます。</span></label><label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.6;margin:12px 0"><input type="checkbox" name="exactPublic" style="margin-top:3px"> <span>GPSの正確な座標も公開する<br><span class="muted">初期設定はオフ。通常はスポット名のみ公開し、自宅などの位置が漏れないようにします。</span></span></label><button class="btn full" type="submit">この訪問を保存する</button></form>`}
function getCurrentLocation(){if(!navigator.geolocation){gpsStatus='この環境では位置情報に対応していません。スポットを手動で選んで記録できます。';gpsFormOpen=true;render();return}gpsStatus='現在地を取得中…';render();navigator.geolocation.getCurrentPosition(pos=>{gpsPosition={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};gpsStatus='現在地を取得しました。記録するスポットを選んでください。';gpsFormOpen=true;render()},err=>{gpsStatus=err.code===1?'位置情報が許可されませんでした。ブラウザ設定を確認するか、手動で記録してください。':err.code===2?'現在地を取得できませんでした。GPSや位置情報設定を確認してください。':'位置情報の取得がタイムアウトしました。もう一度お試しください。';gpsFormOpen=true;render()},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
function gpsRouteMap(){const pts=gpsVisits.filter(v=>v.latitude!=null&&v.longitude!=null).slice().sort((a,b)=>a.id-b.id);if(!pts.length)return `<div class="empty">GPS座標つきの足あとを保存すると、ここに自分の訪問マップが表示されます。</div>`;if(pts.length===1)return `<div class="mapbox" style="height:170px;display:grid;place-items:center"><div style="text-align:center;background:#ffffffdd;border-radius:12px;padding:12px"><div style="font-size:25px">📍</div><strong>${esc(pts[0].place)}</strong><div class="muted">GPS記録 1件 · ルートは次の訪問から表示</div></div></div>`;const lats=pts.map(p=>p.latitude),lons=pts.map(p=>p.longitude),minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);const xy=pts.map(p=>({x:22+(maxLon===minLon?0.5:(p.longitude-minLon)/(maxLon-minLon))*256,y:18+(maxLat===minLat?0.5:(maxLat-p.latitude)/(maxLat-minLat))*124,p}));return `<div class="mapbox" style="height:190px;position:relative;overflow:hidden"><svg viewBox="0 0 300 160" style="width:100%;height:100%"><rect width="300" height="160" fill="#e8f0e5"/>${[30,70,110].map(y=>`<path d="M0 ${y} Q120 ${y-12} 300 ${y+5}" stroke="#d0dfcf" stroke-width="2" fill="none"/>`).join('')}${[55,115,175,235].map(x=>`<path d="M${x} 0 L${x-15} 160" stroke="#d0dfcf" stroke-width="2"/>`).join('')}<polyline points="${xy.map(q=>q.x+','+q.y).join(' ')}" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${xy.map(q=>q.x+','+q.y).join(' ')}" fill="none" stroke="#1e6a58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${xy.map((q,i)=>`<circle cx="${q.x}" cy="${q.y}" r="7" fill="#fff" stroke="#1e6a58" stroke-width="3"/><text x="${Math.min(255,q.x+9)}" y="${Math.max(12,q.y-9)}" font-size="9" fill="#20312c">${i+1}</text>`).join('')}</svg></div><p class="muted">GPS座標のある記録を訪問順につないだイメージ図。地図タイルや道路情報は未接続です。</p>`}
function gpsVisitsView(){return `<h2 style="margin-top:22px">📍 記録した足あと <span class="muted">(${gpsVisits.length})</span></h2>${gpsVisits.length?gpsVisits.slice().reverse().map(v=>`<div class="card"><div class="postbody"><div class="postmeta"><div class="spotemoji">${v.emoji||'📍'}</div><div class="grow"><strong>${esc(v.place)}</strong><div class="muted">${esc(v.date)} · ${v.public?'全体公開':'自分のみ'}</div></div><button class="action" onclick="toggleVisitVisibility(${v.id})">${v.public?'非公開にする':'公開する'}</button></div>${v.note?`<p style="font-size:13px">${esc(v.note)}</p>`:''}<div class="muted">${v.weather&&v.weather!=='未設定'?`🌤️ ${esc(v.weather)} `:''}${v.temp!==''&&v.temp!=null?`${esc(v.temp)}℃`:''}${v.exactPublic&&v.latitude!=null?` · 座標 ${v.latitude.toFixed(4)}, ${v.longitude.toFixed(4)}`:''}</div><button class="action" onclick="deleteVisit(${v.id})">記録を削除</button></div></div>`).join(''):'<div class="empty">まだ足あとがありません。地図タブから最初のスポットを記録してみてね。</div>'}`}

function openSpot(id){let p=places.find(x=>x.id===id);if(!p)return;detailFrom=tab;tab='detail';renderDetail(p)}
function renderDetail(p){document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));$('#screen').innerHTML=`<button class="back" onclick="go('${detailFrom}')">← 戻る</button>${art(p.emoji,p.name)}<div style="padding:15px 2px"><span class="pill">${p.area} · ${p.kind}</span><h1 style="margin-top:10px">${p.emoji} ${p.name}</h1><p style="font-size:14px;line-height:1.8">${p.desc}</p><div class="weather">🌤️ サンプル天気：${p.weather}　${p.temp}℃</div><div class="statrow"><div class="stat"><strong>${p.visits}</strong><small>訪問記録</small></div><div class="stat"><strong>4.8</strong><small>サンプル評価</small></div><div class="stat"><strong>${posts.filter(x=>x.place===p.name).length}</strong><small>関連投稿</small></div></div><button class="btn full" onclick="startPost('${p.name}')">＋ このスポットを投稿</button><h2 style="margin-top:24px">みんなの口コミ</h2>${reviews.map((r,i)=>`<div class="review"><strong>${r.user}</strong> <span style="color:#d79538">${'★'.repeat(r.stars)}</span><p id="review-text-${i}" style="font-size:13px;line-height:1.7;margin-bottom:5px">${esc(r.text)}</p><button class="action translate-btn" type="button" onclick="translateUserText('review-text-${i}', this)" data-original="${esc(r.text)}">🌐 翻訳する</button></div>`).join('')}<h3 style="margin-top:20px">口コミを書く</h3><label class="field">口コミ<textarea id="reviewText" placeholder="訪れてみた感想をシェア"></textarea></label><button class="btn full" onclick="addReview()">口コミを投稿する</button><h2 style="margin-top:24px">この場所の投稿</h2>${posts.filter(x=>x.place===p.name).map(postCard).join('')||'<div class="empty">まだ投稿がありません。</div>'}</div>`;window.scrollTo(0,0)}
function addReview(){let text=$('#reviewText')?.value.trim();if(!text)return toast('口コミを入力してね');reviews.unshift({user:'あなた',stars:5,text});persistState();toast('口コミを追加しました（デモ）');openSpot(selectedPlace||places[0].id)}
function openBusiness(){tab='business';document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));$('#screen').innerHTML=`<button class="back" onclick="go('profile')">← マイページへ戻る</button><div class="eyebrow">HOST / BUSINESS PAGE</div><h1>佐久の家</h1>${art('🏡','佐久の家')}<p style="font-size:13px;line-height:1.8">長野県佐久市にある、旅の拠点になる家主居住型の宿。ゲストが安心して地域を楽しめるよう、地元のおすすめも紹介しています。</p><div class="card"><div class="postbody"><h2>ページ情報を編集</h2><label class="field">施設・店舗名<input id="bizName" value="佐久の家"></label><label class="field">カテゴリ<select id="bizType"><option>民泊・宿泊</option><option>飲食店・カフェ</option><option>観光スポット</option><option>ショップ</option></select></label><label class="field">住所・エリア<input id="bizAddress" value="長野県佐久市"></label><label class="field">紹介文<textarea id="bizDesc">長野県佐久市にある、旅の拠点になる家主居住型の宿。地元のおすすめも紹介しています。</textarea></label><label class="field">営業時間・案内<input id="bizHours" value="チェックイン情報は予約後にご案内"></label><button class="btn full" onclick="toast('施設情報を保存しました（デモ）')">変更を保存</button></div></div><h2>ホストのおすすめ</h2>${places.filter(p=>p.id!=='saku').slice(0,3).map(p=>`<button class="spotrow" style="width:100%;text-align:left" onclick="openSpot('${p.id}')"><div class="spotemoji">${p.emoji}</div><div class="grow"><strong>${p.name}</strong><div class="muted">${p.desc}</div></div>›</button>`).join('')}`}

function toggleLike(id){let p=posts.find(p=>p.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;render()}

$('#screen').addEventListener('change',e=>{if(e.target.id==='profileImageInput'){const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('画像ファイルを選んでね');return}const reader=new FileReader();reader.onload=()=>{pendingAvatar=String(reader.result||'');const preview=$('#avatarPreview');if(preview)preview.innerHTML=avatarMarkup(pendingAvatar,88)};reader.readAsDataURL(file);return}if(e.target.id!=='mediaFile')return;const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('画像ファイルを選んでね');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);selectedMediaUrl=canvas.toDataURL('image/jpeg',0.78);selectedMediaType='photo';const preview=$('#mediaPreview');if(preview)preview.innerHTML=`<img src="${selectedMediaUrl}" alt="選択した写真"><span>写真プレビュー（端末内に保存）</span>`};img.onerror=()=>toast('この画像を読み込めませんでした');img.src=String(reader.result||'')};reader.readAsDataURL(file);});

Type:selectedMediaUrl?selectedMediaType:'photo',mediaUrl:selectedMediaUrl,likes:0,saved:false,liked:false};posts.unshift(post);selectedMediaUrl='';selectedMediaType='photo';filter='すべて';feedMode='list';tab='feed';render();toast('シェアしました！（デモ）')});

<script>
/* User-generated post and review translation. Uses MyMemory public translation endpoint; requires internet. */
async function translateUserText(elementId, button){
 const target=(document.getElementById('languageSelect')||{}).value||'ja';
 const node=document.getElementById(elementId);
 if(!node)return;
 const original=button.dataset.original||node.textContent||'';
 if(!original.trim())return;
 if(node.dataset.translated==='yes'){node.textContent=original;node.dataset.translated='no';button.textContent='🌐 翻訳する';return;}
 const source=detectTextLanguage(original);
 if(source===target){node.textContent=original;button.textContent='✓ 翻訳対象の言語と同じ';return;}
 const langMap={ja:'ja',en:'en',ko:'ko',zh:'zh-CN'};
 const pair=(langMap[source]||'en')+'|'+(langMap[target]||'en');
 const oldLabel=button.textContent;button.disabled=true;button.textContent='翻訳中…';
 try{
  const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(original.slice(0,450))+'&langpair='+encodeURIComponent(pair);
  const response=await fetch(url);
  if(!response.ok)throw new Error('translation api error');
  const data=await response.json();
  const translated=data&&data.responseData&&data.responseData.translatedText;
  if(!translated||data.responseStatus===403)throw new Error('no translation');
  node.textContent=translated;
  node.dataset.translated='yes';
  button.textContent='↩ 原文を表示';
 }catch(e){
  button.textContent='翻訳できませんでした';
  alert('翻訳を取得できませんでした。インターネット接続を確認して、もう一度お試しください。');
 }finally{button.disabled=false;if(button.textContent==='翻訳中…')button.textContent=oldLabel;}
}
function detectTextLanguage(text){
 if(/[가-힣]/.test(text))return 'ko';
 if(/[ぁ-ゖァ-ヺー]/.test(text))return 'ja';
 if(/[一-龯]/.test(text))return 'zh';
 return 'en';
}
</script>


<script>
/* Automatically translate guest-generated post captions and reviews when the UI language changes. */
(function(){
 const languageMap={ja:'ja',en:'en',ko:'ko',zh:'zh-CN'};
 let running=false, queued=false;
 async function translateOne(node, button, target){
   const original=button.dataset.original || node.dataset.original || node.textContent || '';
   if(!original.trim()) return;
   node.dataset.original=original;
   if(!button.dataset.original) button.dataset.original=original;
   const source=detectTextLanguage(original);
   if(source===target){node.textContent=original;node.dataset.translatedLang=target;button.textContent='🌐 '+(target==='ja'?'翻訳':'Translate');button.style.display='none';return;}
   const langPair=(languageMap[source]||'en')+'|'+(languageMap[target]||'en');
   node.textContent=original;
   button.textContent=target==='ja'?'翻訳中…':'Translating…';
   button.style.display='';
   try{
     const res=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(original.slice(0,450))+'&langpair='+encodeURIComponent(langPair));
     if(!res.ok) throw new Error('translation unavailable');
     const data=await res.json();
     const translated=data?.responseData?.translatedText;
     if(!translated || data.responseStatus===403) throw new Error('translation unavailable');
     node.textContent=translated;node.dataset.translatedLang=target;
     button.textContent=target==='ja'?'↩ 原文を表示':'↩ Show original';
     button.style.display='';
     button.onclick=function(){node.textContent=original;node.dataset.translatedLang='original';button.textContent=target==='ja'?'🌐 翻訳':'🌐 Translate';button.onclick=()=>translateOne(node,button,target);};
   }catch(e){
     node.textContent=original;node.dataset.translatedLang='failed';
     button.textContent=target==='ja'?'🌐 翻訳（接続が必要）':'🌐 Translate (internet required)';
     button.onclick=()=>translateOne(node,button,target);
   }
 }
 window.autoTranslateGuestText=async function(){
   if(running){queued=true;return;}
   running=true;
   try{
     const target=document.getElementById('languageSelect')?.value||'ja';
     const buttons=[...document.querySelectorAll('.translate-btn')];
     for(const button of buttons){
       const id=(button.getAttribute('onclick')||'').match(/'([^']+)'/);
       const node=id?document.getElementById(id[1]):button.previousElementSibling;
       if(!node)continue;
       const original=button.dataset.original||node.dataset.original||node.textContent||'';
       if(node.dataset.translatedLang===target)continue;
       await translateOne(node,button,target);
     }
   } finally {running=false;if(queued){queued=false;setTimeout(window.autoTranslateGuestText,250);}}
 };
 document.addEventListener('change',e=>{if(e.target && e.target.id==='languageSelect')setTimeout(window.autoTranslateGuestText,100);});
 const init=()=>{const screen=document.getElementById('screen');if(!screen)return;let timer;new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(window.autoTranslateGuestText,500);}).observe(screen,{childList:true,subtree:true});setTimeout(window.autoTranslateGuestText,600);};
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

 const originalNodes = new WeakMap();
 const pairsCache = {};
 function translateText(text, lang){
   if(lang==='ja') return text;
   const pairs = dictionaries[lang] || [];
   if(!pairsCache[lang]) pairsCache[lang] = pairs.slice().sort((a,b)=>b[0].length-a[0].length);
   let out=text;
   for(const [ja, tr] of pairsCache[lang]) out=out.split(ja).join(tr);
   return out;
 }
 function applyLanguage(lang){
   document.documentElement.lang = lang==='zh'?'zh-CN':lang;
   document.querySelectorAll('#languageSelect').forEach(s=>{if(s.value!==lang)s.value=lang});
   const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
   let n;
   while(n=walker.nextNode()){
     const parent=n.parentElement;
     if(!parent || parent.closest('script,style,select,option')) continue;
     if(!originalNodes.has(n)) originalNodes.set(n,n.nodeValue);
     const original=originalNodes.get(n);
     const translated=translateText(original,lang);
     if(n.nodeValue!==translated) n.nodeValue=translated;
   }
   document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{
     if(!el.dataset.originalPlaceholder) el.dataset.originalPlaceholder=el.placeholder;
     el.placeholder=translateText(el.dataset.originalPlaceholder,lang);
   });
   const search=document.getElementById('globalSearch');
   if(search) search.setAttribute('aria-label', lang==='en'?'Search':lang==='ko'?'검색':lang==='zh'?'搜索':'検索');
 }
 function setup(){
   const sel=document.getElementById('languageSelect');
   if(!sel) return;
   let lang='ja';
   try{lang=localStorage.getItem('tabinote_language')||'ja'}catch(e){}
   sel.value=lang; applyLanguage(lang);
   sel.addEventListener('change',()=>{const v=sel.value;try{localStorage.setItem('tabinote_language',v)}catch(e){}applyLanguage(v)});
   const observer=new MutationObserver(()=>applyLanguage(sel.value||'ja'));
   observer.observe(document.getElementById('screen')||document.body,{childList:true,subtree:true,characterData:true});
 }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup); else setup();
})();
</script>
